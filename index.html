<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F7EDF0">
<title>Coach Leslie — Pickleball Training</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="17" fill="%23D8547F"/><ellipse cx="27.5" cy="25" rx="12.5" ry="14.5" fill="%23FFF1F5"/><path d="M27.5 39.5 L27.5 49 Q27.5 51.5 30 51.5 L44 51.5" stroke="%23FFF1F5" stroke-width="5.4" stroke-linecap="round" fill="none"/><circle cx="45.5" cy="18.5" r="6" fill="%23F2A97E"/></svg>'>
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="17" fill="%23D8547F"/><ellipse cx="27.5" cy="25" rx="12.5" ry="14.5" fill="%23FFF1F5"/><path d="M27.5 39.5 L27.5 49 Q27.5 51.5 30 51.5 L44 51.5" stroke="%23FFF1F5" stroke-width="5.4" stroke-linecap="round" fill="none"/><circle cx="45.5" cy="18.5" r="6" fill="%23F2A97E"/></svg>'>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Coach Leslie">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── Coach Leslie palette ────────────────────────────────────────────────────────
   Deliberately unlike Match Day Pickle's dark navy + hot pink sport look. This is
   soft daylight: blush paper, plum ink, a rose primary, apricot and sage accents.
   "Girly" read as warm and gentle rather than candy — it has to stay legible at
   arm's length on a phone in bright sun courtside.                              */
:root{
  --paper:#FBF4F6;      /* blush paper base            */
  --card:#FFFFFF;
  --ink:#3B2233;        /* deep plum, body text        */
  --ink-soft:#8A6E7F;   /* muted plum, secondary text  */
  --rose:#D8547F;       /* primary action              */
  --rose-deep:#B23C64;
  --rose-wash:#FBE7EE;
  --apricot:#F2A97E;    /* warm accent                 */
  --sage:#7BAE9A;       /* success / confirmed         */
  --line:#F0DDE4;
  --shadow:0 2px 14px rgba(178,60,100,.09);
  --r:18px;
  --rs:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Outfit',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-x:hidden;
}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;margin:0;letter-spacing:-.01em}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}
.hide{display:none!important}

/* ── Signature: the arc. A hand-drawn racket sweep behind the wordmark, echoed as
   the rounded top edge of every day card. One motif, used twice, nothing else. ── */
.topbar{
  position:relative;padding:26px 18px 22px;text-align:center;overflow:hidden;
  background:linear-gradient(168deg,#FDEFF3 0%,#FBF4F6 70%);
}
.topbar::after{
  content:'';position:absolute;left:-12%;right:-12%;bottom:-46px;height:92px;
  border-radius:50%;background:var(--paper);
}
.logo{
  position:relative;z-index:2;width:62px;height:62px;display:block;margin:0 auto 11px;
  border-radius:17px;box-shadow:0 5px 18px rgba(178,60,100,.26);
}
.ai{border-radius:var(--rs);padding:11px 13px;font-size:12.5px;margin-top:10px;white-space:pre-wrap;line-height:1.45}
.ai.good{background:#EAF5F1;color:#37705D;border:1px solid #CBE5DC}
.ai.warn{background:#FDF0E4;color:#95562A;border:1px solid #F6DCC3}
.ai.busy{background:#F3EDF8;color:#6B5085;border:1px solid #E4D8EE}
.bar{height:5px;border-radius:99px;background:#E4D8EE;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;width:35%;border-radius:99px;background:var(--rose);animation:slide 1.15s ease-in-out infinite}
@keyframes slide{0%{margin-left:-35%}100%{margin-left:100%}}
@media (prefers-reduced-motion:reduce){.bar i{animation:none;width:100%;opacity:.5}}
.gc-saved{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#FFF8FA;border:1px solid var(--line);border-radius:var(--rs);padding:12px 14px;margin-bottom:12px;font-size:13.5px}
.mark{position:relative;z-index:2;font-family:'Fraunces',serif;font-weight:600;font-size:27px;letter-spacing:-.02em;color:var(--ink)}
.mark em{font-style:italic;color:var(--rose)}
.mark-sub{position:relative;z-index:2;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-soft);margin-top:5px}
.who{position:relative;z-index:2;margin-top:12px;font-size:12px;color:var(--ink-soft)}
.who b{color:var(--rose-deep)}
.linkbtn{background:none;border:none;color:var(--ink-soft);font-family:inherit;font-size:12px;text-decoration:underline;cursor:pointer;padding:2px 4px}

/* ── Controls ─────────────────────────────────────────────────────────────────── */
.btn{
  display:block;width:100%;border:none;border-radius:999px;cursor:pointer;
  font-family:'Outfit',sans-serif;font-weight:600;font-size:15px;padding:14px 18px;
  background:var(--rose);color:#fff;transition:transform .12s ease,background .16s ease;
}
.btn:hover:not(:disabled){background:var(--rose-deep)}
.btn:active:not(:disabled){transform:scale(.985)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:#fff;color:var(--rose-deep);border:1.5px solid var(--line)}
.btn.quiet{background:var(--rose-wash);color:var(--rose-deep)}
.btn.sm{width:auto;padding:9px 16px;font-size:13px}
.field{
  width:100%;padding:13px 14px;margin-bottom:10px;border:1.5px solid var(--line);
  border-radius:var(--rs);background:#fff;color:var(--ink);
  font-family:'Outfit',sans-serif;font-size:15px;
}
.field:focus{outline:none;border-color:var(--rose);box-shadow:0 0 0 3px var(--rose-wash)}
label.lbl{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin:0 0 5px 3px}
:focus-visible{outline:2.5px solid var(--rose);outline-offset:2px}

/* ── Cards ────────────────────────────────────────────────────────────────────── */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.card-hd{padding:16px 18px 13px;background:linear-gradient(180deg,#FFF8FA,#fff);border-bottom:1px solid var(--line)}
.card-date{font-family:'Fraunces',serif;font-size:19px;font-weight:600}
.card-meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
.slot{padding:13px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.slot:first-of-type{border-top:none}
.slot-time{font-family:'Fraunces',serif;font-size:16px;font-weight:600;flex:1;min-width:118px}
.who-in{font-size:12.5px;color:var(--ink-soft);width:100%;margin-top:-4px}
.pill{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 11px;border-radius:999px}
.pill.open{background:#E9F4F0;color:#3F7D68}
.pill.some{background:#FDF0E4;color:#B5713C}
.pill.full{background:var(--rose-wash);color:var(--rose-deep)}
.pill.wait{background:#F3EDF8;color:#7A5B96}
.money{background:#FFFAF6;border:1px dashed var(--apricot);border-radius:var(--rs);padding:13px;margin:0 18px 14px}
.money-top{font-size:13.5px;font-weight:600}
.money-sub{font-size:12px;color:var(--ink-soft);margin:4px 0 10px}
.gcash{font-family:'Fraunces',serif;font-size:17px;color:var(--rose-deep);font-weight:700;letter-spacing:.02em}
.note{background:#F3EDF8;border-radius:var(--rs);padding:11px 13px;font-size:12.5px;color:#5E4470;margin:0 18px 14px}
.empty{text-align:center;padding:34px 20px;color:var(--ink-soft);font-size:14px}
.empty .big{font-family:'Fraunces',serif;font-style:italic;font-size:19px;color:var(--ink);display:block;margin-bottom:6px}
.sect{font-size:11.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft);margin:26px 0 11px 3px}
.sect:first-child{margin-top:4px}
.stat{display:flex;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);font-size:14px}
.stat:last-child{border-bottom:none}
.stat b{font-family:'Fraunces',serif;font-size:16px;color:var(--sage)}
.tot{background:var(--rose);color:#fff;padding:18px;border-radius:var(--r);text-align:center;margin-bottom:14px}
.tot .n{font-family:'Fraunces',serif;font-size:33px;font-weight:700;display:block;line-height:1.1}
.tot .l{font-size:11px;letter-spacing:.16em;text-transform:uppercase;opacity:.9}
.tabs{display:flex;gap:8px;margin:16px 0 4px}
.tab{flex:1;padding:11px 6px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-family:'Outfit';font-weight:600;font-size:13.5px;cursor:pointer}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(120%);
  background:var(--ink);color:#fff;padding:13px 20px;border-radius:999px;font-size:13.5px;
  z-index:99;transition:transform .3s cubic-bezier(.2,.9,.3,1.2);max-width:88vw;text-align:center;
}
.toast.up{transform:translateX(-50%) translateY(0)}
.load{text-align:center;padding:40px;color:var(--ink-soft);font-style:italic;font-family:'Fraunces',serif}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<div class="topbar">
  <svg class="logo" viewBox="0 0 64 64" role="img" aria-label="Coach Leslie">
      <rect width="64" height="64" rx="17" fill="#D8547F"/>
      <ellipse cx="27.5" cy="25" rx="12.5" ry="14.5" fill="#FFF1F5"/>
      <path d="M27.5 39.5 L27.5 49 Q27.5 51.5 30 51.5 L44 51.5" stroke="#FFF1F5" stroke-width="5.4" stroke-linecap="round" fill="none"/>
      <circle cx="45.5" cy="18.5" r="6" fill="#F2A97E"/>
    </svg>
  <div class="mark">Coach <em>Leslie</em></div>
  <div class="mark-sub">Pickleball Training</div>
  <div class="who hide" id="who"></div>
</div>

<div class="wrap">
  <!-- AUTH -->
  <div id="scr-auth" class="hide">
    <div class="card" style="padding:20px">
      <h2 style="font-size:22px;margin-bottom:4px">Book your session</h2>
      <p style="font-size:13.5px;color:var(--ink-soft);margin:0 0 18px">Sign in, pick a time, and pay with GCash.</p>
      <div class="tabs" style="margin-top:0">
        <button class="tab on" id="tab-in" onclick="authMode('in')">Sign in</button>
        <button class="tab" id="tab-up" onclick="authMode('up')">New here</button>
      </div>
      <div id="fld-name" class="hide" style="margin-top:14px">
        <label class="lbl" for="a-name">Your name</label>
        <input id="a-name" class="field" autocomplete="name" placeholder="Maria Santos">
      </div>
      <div style="margin-top:14px">
        <label class="lbl" for="a-email">Email</label>
        <input id="a-email" class="field" type="email" autocomplete="email" placeholder="you@email.com">
      </div>
      <label class="lbl" for="a-pass">Password</label>
      <input id="a-pass" class="field" type="password" autocomplete="current-password" placeholder="••••••••">
      <button class="btn" id="a-go" onclick="doAuth()">Sign in</button>
      <p id="a-msg" style="font-size:12.5px;color:var(--rose-deep);text-align:center;margin:12px 0 0"></p>
    </div>
  </div>

  <!-- CLIENT -->
  <div id="scr-client" class="hide">
    <div class="tabs">
      <button class="tab on" id="ct-book" onclick="clientTab('book')">Open slots</button>
      <button class="tab" id="ct-mine" onclick="clientTab('mine')">My sessions</button>
    </div>
    <div id="client-body"><div class="load">Loading…</div></div>
  </div>

  <!-- COACH -->
  <div id="scr-coach" class="hide">
    <div class="tabs">
      <button class="tab on" id="kt-sched" onclick="coachTab('sched')">Sessions</button>
      <button class="tab" id="kt-req" onclick="coachTab('req')">Requests</button>
      <button class="tab" id="kt-pay" onclick="coachTab('pay')">Payments</button>
      <button class="tab" id="kt-money" onclick="coachTab('money')">Earnings</button>
      <button class="tab" id="kt-credit" onclick="coachTab('credit')">Credits</button>
    </div>
    <div id="coach-body"><div class="load">Loading…</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* Shared backend with Match Day Pickle: same Supabase project + training-api, but a
   completely separate front end. Days are scoped 'external' here, so nothing on this
   site ever touches club-hosted training. */
var SB_URL='https://uhfsyzsgqcrcguqvgnnb.supabase.co';
var SB_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVoZnN5enNncWNyY2d1cXZnbm5iIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk4MjcyNzIsImV4cCI6MjA5NTQwMzI3Mn0.Nb-w85Q62UERKG548beQheeIYIanNO6qV3ZTnP6lu6E';
var sb=supabase.createClient(SB_URL,SB_ANON);
var TRAIN=SB_URL+'/functions/v1/training-api';
var UPLOAD=SB_URL+'/functions/v1/mdp-api';

var ME=null,DAYS=[],_mode='in',_ctab='book',_ktab='sched';

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.classList.add('up');clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove('up');},3400);}
function peso(n){return '₱'+Number(n||0).toLocaleString();}
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Manila'});}
function fmtTime(t){if(!t)return '';var p=String(t).split(':'),h=parseInt(p[0],10),m=p[1]||'00';var ap=h>=12?'PM':'AM';var hh=h%12;if(hh===0)hh=12;return hh+(m==='00'?'':':'+m)+' '+ap;}
function fmtDate(d){if(!d)return '';var dt=new Date(d+'T12:00:00');return ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][dt.getDay()]+', '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()]+' '+dt.getDate();}
function token(){return sb.auth.getSession().then(function(r){return r.data.session&&r.data.session.access_token;});}

function api(action,method,body){
  return token().then(function(t){
    if(!t)throw new Error('Please sign in again');
    return fetch(TRAIN+'?action='+encodeURIComponent(action),{
      method:method||'GET',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+t,'apikey':SB_ANON},
      body:body?JSON.stringify(body):undefined
    });
  }).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error((j&&j.error)||('Something went wrong ('+r.status+')'));return j;});});
}
function uploadImage(file){
  return token().then(function(t){
    return fetch(UPLOAD+'?action=upload-proof',{method:'POST',
      headers:{'Authorization':'Bearer '+t,'apikey':SB_ANON,'x-mdp-action':'upload-proof','x-file-type':file.type||'image/jpeg'},
      body:file});
  }).then(function(r){return r.json();}).then(function(j){
    var u=j&&(j.url||j.publicUrl||j.proof_url);
    if(!u)throw new Error('Upload failed — try again');
    return u;
  });
}

/* ── Auth ─────────────────────────────────────────────────────────────────────── */
function authMode(m){
  _mode=m;
  document.getElementById('tab-in').classList.toggle('on',m==='in');
  document.getElementById('tab-up').classList.toggle('on',m==='up');
  document.getElementById('fld-name').classList.toggle('hide',m!=='up');
  document.getElementById('a-go').textContent=m==='in'?'Sign in':'Create account';
  document.getElementById('a-pass').setAttribute('autocomplete',m==='in'?'current-password':'new-password');
  document.getElementById('a-msg').textContent='';
}
function doAuth(){
  var email=(document.getElementById('a-email').value||'').trim();
  var pass=document.getElementById('a-pass').value||'';
  var name=(document.getElementById('a-name').value||'').trim();
  var msg=document.getElementById('a-msg');
  if(!email||!pass){msg.textContent='Enter your email and password to continue.';return;}
  if(_mode==='up'&&!name){msg.textContent='Add your name so Coach Leslie knows who booked.';return;}
  var btn=document.getElementById('a-go');btn.disabled=true;btn.textContent='One moment…';
  var p=_mode==='in'?sb.auth.signInWithPassword({email:email,password:pass})
                    :sb.auth.signUp({email:email,password:pass,options:{data:{full_name:name}}});
  p.then(function(res){
    if(res.error)throw res.error;
    if(!res.data.session)throw new Error('Check your email to confirm your account, then sign in.');
    return api('claim-client','POST',{full_name:name});
  }).then(function(){boot();})
   .catch(function(e){
     btn.disabled=false;btn.textContent=_mode==='in'?'Sign in':'Create account';
     msg.textContent=e.message||'That did not work. Check your details and try again.';
   });
}
function signOut(){sb.auth.signOut().then(function(){location.reload();});}

/* ── Boot ─────────────────────────────────────────────────────────────────────── */
function show(id){['scr-auth','scr-client','scr-coach'].forEach(function(s){document.getElementById(s).classList.toggle('hide',s!==id);});}
function boot(){
  sb.auth.getSession().then(function(r){
    if(!r.data.session){show('scr-auth');authMode('in');document.getElementById('who').classList.add('hide');return;}
    return api('days','GET').then(function(d){
      DAYS=d.days||[];ME=d.me||{};
      var w=document.getElementById('who');
      w.classList.remove('hide');
      w.innerHTML='Hi, <b>'+esc((ME.full_name||'').split(' ')[0]||'there')+'</b> · <button class="linkbtn" onclick="signOut()">Sign out</button>';
      if(ME.is_coach){show('scr-coach');renderCoach();}else{show('scr-client');renderClient();}
    });
  }).catch(function(e){
    show('scr-auth');authMode('in');
    document.getElementById('a-msg').textContent=e.message||'Please sign in.';
  });
}
function reload(){return api('days','GET').then(function(d){DAYS=d.days||[];ME=d.me||ME;if(ME.is_coach)renderCoach();else renderClient();pollIfChecking();});}

/* ── Shared helpers over the day tree ─────────────────────────────────────────── */
function seatsOf(b){var n=0;(b.bookings||[]).forEach(function(bk){if(bk.status!=='active')return;n+=(bk.participants||[]).length;});return n;}
function myBooking(b){var f=null;(b.bookings||[]).forEach(function(bk){if(ME&&bk.booked_by===ME.id&&bk.status!=='cancelled')f=bk;});return f;}
function myLines(){
  var out=[];
  DAYS.forEach(function(d){(d.blocks||[]).forEach(function(b){(b.bookings||[]).forEach(function(bk){
    if(!ME||bk.booked_by!==ME.id||bk.status==='cancelled')return;
    (bk.participants||[]).forEach(function(p){(p.lines||[]).forEach(function(l){out.push({l:l,p:p,b:b,d:d,bk:bk});});});
  });});});
  return out;
}

/* ── Client ───────────────────────────────────────────────────────────────────── */
function clientTab(t){_ctab=t;document.getElementById('ct-book').classList.toggle('on',t==='book');document.getElementById('ct-mine').classList.toggle('on',t==='mine');renderClient();}
function renderClient(){
  var el=document.getElementById('client-body');
  if(_ctab==='mine')return renderMine(el);
  var t=today();
  var upcoming=DAYS.filter(function(d){return d.session_date>=t;});
  if(!upcoming.length){el.innerHTML='<div class="empty"><span class="big">No open times yet</span>Coach Leslie posts new sessions here — check back soon.</div>';return;}
  el.innerHTML=upcoming.map(function(d){
    var slots=(d.blocks||[]).map(function(b){
      var seats=seatsOf(b),cap=b.tier?b.max_pax:2,mine=myBooking(b);
      var names=[];(b.bookings||[]).forEach(function(bk){if(bk.status!=='active')return;(bk.participants||[]).forEach(function(p){names.push(esc(p.display_name));});});
      var pill=b.status==='cancelled'?'<span class="pill full">Cancelled</span>'
        :mine&&mine.status==='pending'?'<span class="pill wait">Waiting for coach</span>'
        :seats>=cap?'<span class="pill full">Full</span>'
        :seats>0?'<span class="pill some">'+(cap-seats)+' spot left</span>'
        :'<span class="pill open">Open</span>';
      var act='';
      if(!mine&&seats<cap&&b.status!=='cancelled'){
        act='<button class="btn quiet sm" onclick="openBook(\''+b.id+'\')">Book</button>';
      }else if(mine){
        act='<button class="btn ghost sm" onclick="cancelBk(\''+mine.id+'\')">Cancel</button>';
      }
      return '<div class="slot"><span class="slot-time">'+fmtTime(b.time_start)+' – '+fmtTime(b.time_end)+'</span>'+pill+act+
        (names.length?'<div class="who-in">With '+names.join(', ')+'</div>':'')+'</div>'+
        '<div id="bf-'+b.id+'" class="hide" style="padding:0 18px 16px">'+
          '<label class="lbl">Who is playing?</label>'+
          '<select class="field" id="bm-'+b.id+'" onchange="bmChange(\''+b.id+'\')"><option value="solo">Just me</option><option value="pair">Me and a partner</option></select>'+
          '<input class="field hide" id="bg-'+b.id+'" placeholder="Partner\'s name">'+
          '<button class="btn" onclick="confirmBook(\''+b.id+'\',this)">Confirm booking</button>'+
        '</div>';
    }).join('');

function openBook(id){document.getElementById('bf-'+id).classList.toggle('hide');}
function confirmBook(id,btn){

    if(!g){toast('Add your partner’s name');return;}

  }

  api('book','POST',{block_id:id,participants:parts}).then(function(r){

  }).catch(function(e){btn.disabled=false;btn.textContent='Confirm booking';toast(e.message);});

function removeBk(participantId,who){
  // Removes ONE player. It used to take the booking id, so removing a partner also
  // removed whoever booked — including a fee they had already paid (18 Aug).
  if(!confirm('Remove '+(who||'this player')+' from the slot?\n\nOnly they are removed — anyone else in that hour stays. They get everything back as credit, whatever the timing.'))return;
  var why=prompt('Reason (optional, kept on the record):','');
  if(why===null)return;
  sb.rpc('coach_remove_participant',{p_participant:participantId,p_reason:why.trim()||null}).then(function(r){
    if(r.error)throw new Error(r.error.message);
    var d=r.data||{};
    toast((who||'Player')+' removed'+(Number(d.credited)>0?' — '+peso(d.credited)+' credited back':''));
    return reload();
  }).catch(function(e){toast(e.message||'Could not remove');});
}
function cancelBk(id){
  if(!confirm('Cancel this booking?\n\nMore than 12 hours before the session, your coach fee comes back as credit. Under 12 hours, the coach fee is forfeited.'))return;
  api('cancel-booking','POST',{booking_id:id}).then(function(r){
    var m='Booking cancelled';
    if(r&&r.credited)m+=' — '+peso(r.credited)+' credited to you';
    if(r&&r.forfeited)m+=' — '+peso(r.forfeited)+' forfeited (under 12h)';
    toast(m);return reload();
  }).catch(function(e){toast(e.message);});
}
function renderMine(el){

  var byBk={};var order=[];
  rows.forEach(function(r){if(!byBk[r.bk.id]){byBk[r.bk.id]=[];order.push(r);}byBk[r.bk.id].push(r);});
  el.innerHTML=order.map(function(first){
    var set=byBk[first.bk.id],d=first.d,b=first.b;
    var pending=first.bk.status==='pending';
    var lines=set.map(function(r){
      var l=r.l,st=l.status;

      if(st==='proof_uploaded')return '<div class="stat"><span>'+esc(r.p.display_name)+'</span><span style="color:var(--ink-soft)">'+(l.ai_status==='checking'?'Checking your receipt…':'Sent — waiting for coach')+'</span></div>';
      if(st==='credited')return '<div class="stat"><span>'+esc(r.p.display_name)+'</span><span style="color:var(--ink-soft)">Credited back</span></div>';
      if(st==='forfeited')return '<div class="stat"><span>'+esc(r.p.display_name)+'</span><span style="color:var(--rose-deep)">Forfeited</span></div>';
      if(st==='waived')return '';

        '<div class="money-sub">Send by GCash to <span class="gcash">'+esc(l.payee_gcash_number||'—')+'</span>'+(l.payee_gcash_name?' · '+esc(l.payee_gcash_name):'')+'</div>'+
        '<input type="file" accept="image/*" id="f-'+l.id+'" class="hide" onchange="sendProof(this,\''+l.id+'\')">'+

function sendProof(input,lineId){

/* ── Coach ────────────────────────────────────────────────────────────────────── */
function coachTab(t){_ktab=t;['sched','req','pay','money','credit'].forEach(function(k){var el=document.getElementById('kt-'+k);if(el)el.classList.toggle('on',k===t||(t==='post'&&k==='sched'));});renderCoach();}

function pendingJoins(){
  var out=[];
  DAYS.forEach(function(d){(d.blocks||[]).forEach(function(b){(b.bookings||[]).forEach(function(bk){
    if(bk.status==='pending')out.push({bk:bk,b:b,d:d});
  });});});
  return out;
}
function pendingPays(){
  var out=[];
  // COACH FEES ONLY. Since 2026-08-15 MDP training days also raise a 'club' payment line
  // for the court + ball boy share, which players send to Meg at the club — not to the
  // coach. Those receipts must never appear here: confirming one would mark money as
  // received that never reached this account.
  DAYS.forEach(function(d){(d.blocks||[]).forEach(function(b){(b.bookings||[]).forEach(function(bk){
    (bk.participants||[]).forEach(function(p){(p.lines||[]).forEach(function(l){
      if(l.component!=='coach')return;
      if(l.status==='proof_uploaded')out.push({l:l,p:p,b:b,d:d});
    });});
  });});});
  return out;
}
function badgeTabs(){
  var j=pendingJoins().length;
  var el=document.getElementById('kt-req'); if(el)el.textContent=j?'Requests ('+j+')':'Requests';
  sb.rpc('coach_payments_pending').then(function(r){
    var p=(r.data||[]).length;
    var pe=document.getElementById('kt-pay'); if(pe)pe.textContent=p?'Payments ('+p+')':'Payments';
  }).catch(function(){});
}

// Cancel a whole session — storm, injury, venue closed. Everyone who paid gets it all
// back as credit whatever the timing, because the cancellation is the coach's decision,
// not theirs. The ordinary 12-hour forfeit rule only applies when a PLAYER pulls out.
// A player who pays cash on the court, or by GCash without bothering to upload anything.
// Recorded against the payment line with her name and the time, so the money is accounted
// for and she is not left chasing someone who has already settled up.
function markPaidHere(lineId,name){
  var how=prompt('How did '+name+' pay you?\n\nThis marks the coaching fee as settled.','Cash at the session');
  if(how===null)return;
  sb.rpc('training_line_admin_fix',{p_line:lineId,p_action:'settled_elsewhere',p_note:(how.trim()||'Paid in person')})
    .then(function(r){
      if(r.error)throw new Error(r.error.message);
      toast(name+' marked as paid');
      return reload();
    }).catch(function(e){toast(e.message||'Could not update');});
}

function cancelDay(dayId,label){
  if(!confirm('Cancel '+label+' completely?\n\nEveryone booked is cancelled and anyone who already paid gets their full fee back as credit — no matter how close to the session it is.\n\nThis cannot be undone.'))return;
  var reason=prompt('Reason to show players (optional):','Storm');
  if(reason===null)return;
  sb.rpc('training_day_cancel',{p_day:dayId,p_reason:reason.trim()||null}).then(function(r){
    if(r.error)throw new Error(r.error.message);
    var d=r.data||{};
    toast('Session cancelled — ₱'+Math.round(Number(d.coach_credited||0)).toLocaleString()+' returned as credit');
    return reload();
  }).catch(function(e){toast(e.message||'Could not cancel');});
}

// Coaching credit the players are holding. Without this the money we hand back is

function recheck(lineId){
  api('recheck-line','POST',{line_id:lineId}).then(function(){toast('Checking…');return reload();}).catch(function(e){toast(e.message);});
}
/* While any receipt is mid-check, refresh quietly every 4s (max ~1 min) so the result
   appears on its own instead of the coach wondering whether it is stuck. */
var _poll=null,_polls=0;
function pollIfChecking(){
  if(_poll){clearTimeout(_poll);_poll=null;}
  var checking=false;
  DAYS.forEach(function(d){(d.blocks||[]).forEach(function(b){(b.bookings||[]).forEach(function(bk){
    (bk.participants||[]).forEach(function(p){(p.lines||[]).forEach(function(l){if(l.ai_status==='checking')checking=true;});});
  });});});
  if(!checking){_polls=0;return;}
  if(_polls>=15){_polls=0;return;}
  _polls++;
  _poll=setTimeout(function(){reload();},4000);
}

function rvJoin(id,dec){

  api('review-line','PATCH',{line_id:id,decision:dec}).then(function(){toast(dec==='approve'?'Payment confirmed':'Marked not received');return reload();}).catch(function(e){toast(e.message);});

function renderSched(el){
  var t=today();
  var up=DAYS.filter(function(d){return d.session_date>=t;});
  var postBtn='<button class="btn" style="margin-bottom:16px" onclick="coachTab(\'post\')">+ Post a session</button>';
  if(!up.length){el.innerHTML=postBtn+'<div class="empty"><span class="big">No sessions yet</span>Post the hours you are free and players can start booking.</div>';return;}
  el.innerHTML=postBtn+'<div class="sect">Upcoming</div>'+up.map(function(d){
    var rows=(d.blocks||[]).map(function(b){
      // Each booked player is listed individually with a Remove control. Joins now
      // auto-approve (2026-08-15), so this is how a bad pairing gets undone — and it
      // credits the player back in full, whatever the timing, because the removal is
      // the coach's decision and not theirs.
      var people=[];
      (b.bookings||[]).forEach(function(bk){
        if(bk.status!=='active')return;
        (bk.participants||[]).forEach(function(p){
          // Show whether each player has actually paid the coaching fee. Without this the
          // coach has no way of knowing who owes her — the Payments tab only lists
          // receipts already uploaded, so anyone who has not paid is simply invisible
          // (Hanny, Abraham, Ann and Carol on 18 Aug).
          var cl=(p.lines||[]).filter(function(l){return l.component==='coach';})[0];
          var st=cl?cl.status:null;
          var paid = st==='approved'||st==='credited';
          var tag = paid ? '<span style="font-size:11px;color:#2E7D4F;font-weight:700">paid</span>'
                  : st==='proof_uploaded' ? '<span style="font-size:11px;color:#B7791F;font-weight:700">to confirm</span>'
                  : '<span style="font-size:11px;color:#C2405F;font-weight:700">not paid</span>';
          // Plenty of players will simply hand over cash on the court. Without this she
          // has no way to record it and they stay "not paid" forever.
          var payBtn = (cl && !paid && st!=='proof_uploaded')
            ? '<button class="btn ghost sm" style="padding:4px 10px;font-size:11px;color:#2E7D4F" onclick="markPaidHere(\''+cl.id+'\',\''+esc(String(p.display_name||'').replace(/'/g,''))+'\')">Paid me</button>'
            : '';
          people.push('<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0">'+
            '<span style="font-size:13px;color:var(--ink-soft)">'+esc(p.display_name)+'</span>'+
            '<span style="display:flex;align-items:center;gap:8px">'+tag+payBtn+
            '<button class="btn ghost sm" style="padding:4px 10px;font-size:11px" onclick="removeBk(\''+p.id+'\',\''+esc(String(p.display_name||'').replace(/'/g,''))+'\')">Remove</button>'+
            '</span>'+
          '</div>');
        });
      });
      return '<div class="slot" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'+
        '<span class="slot-time">'+fmtTime(b.time_start)+' – '+fmtTime(b.time_end)+'</span>'+
        (people.length?'':'<span class="pill open">Open</span>')+
      '</div>'+(people.length?'<div style="margin-top:4px">'+people.join('')+'</div>':'')+'</div>';
    }).join('');
    return '<div class="card"><div class="card-hd"><div class="card-date">'+fmtDate(d.session_date)+'</div><div class="card-meta">'+esc((d.venues&&d.venues.name)||'')+(d.scope==='mdp'?' · Match Day Pickle':'')+'</div></div>'+rows+
      '<div style="padding:10px 18px 16px"><button class="btn ghost sm" style="width:100%;color:#C2405F" onclick="cancelDay(\''+d.id+'\',\''+esc(fmtDate(d.session_date))+'\')">Cancel this whole session</button></div>'+
    '</div>';
  }).join('');
}
function renderMoney(el){
  var byDate={},dates=[],paid=0,waiting=0;
  // COACH FEES ONLY — MDP days also carry a 'club' line for the court + ball boy share,
  // which is money sent to the club, not earnings. Counting it here would overstate her
  // income by roughly ₱475–950 per MDP player.
  DAYS.forEach(function(d){(d.blocks||[]).forEach(function(b){(b.bookings||[]).forEach(function(bk){
    (bk.participants||[]).forEach(function(p){(p.lines||[]).forEach(function(l){
      if(l.component!=='coach')return;
      var a=Number(l.amount||0);
      if(!byDate[d.session_date]){byDate[d.session_date]={p:0,w:0};dates.push(d.session_date);}
      if(l.status==='approved'){byDate[d.session_date].p+=a;paid+=a;}
      else if(['unpaid','proof_uploaded','rejected'].indexOf(l.status)>=0){byDate[d.session_date].w+=a;waiting+=a;}
    });});
  });});});
  dates.sort().reverse();
  el.innerHTML='<div class="tot"><span class="n">'+peso(paid)+'</span><span class="l">Confirmed received</span></div>'+
    (waiting?'<div class="note" style="margin:0 0 14px">'+peso(waiting)+' still coming in — confirm receipts on the To do tab.</div>':'')+
    '<div class="card">'+(dates.length?dates.map(function(dt){
      return '<div class="stat"><span>'+fmtDate(dt)+'</span><span><b>'+peso(byDate[dt].p)+'</b>'+(byDate[dt].w?' <span style="color:var(--ink-soft);font-size:12.5px">+'+peso(byDate[dt].w)+' pending</span>':'')+'</span></div>';
    }).join(''):'<div class="empty">No payments yet.</div>')+'</div>';
}

document.addEventListener('keydown',function(e){if(e.key==='Enter'&&!document.getElementById('scr-auth').classList.contains('hide'))doAuth();});
boot();
</script>
